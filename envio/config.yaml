# Envio HyperIndex configuration for Monad-PageSync
# https://docs.envio.dev/docs/configuration

name: monad-pagesync
description: Indexes order-book events from NaiveOrderBook and PageSyncOrderBook on Monad Testnet

chains:
  - id: 10143           # Monad Testnet chain ID
    rpc: "https://testnet-rpc.monad.xyz"
    start_block: 68348601
    contracts:
      - name: NaiveOrderBook
        address:
          - "0x9eDDb8B7612954014Af0fFA58dc9d93dB2C75d68"
        start_block: 68348601
        abi_file_path: ./abis/IOrderBook.json
        handler: ./src/handlers/OrderBookHandler.js
        events:
          - event: "OrderPlaced(uint256 indexed orderId, address indexed trader, uint256 price, uint256 quantity, uint8 side)"
            field_selection:
              transaction_fields:
                - hash
          - event: "OrderUpdated(uint256 indexed orderId, uint256 price, uint256 quantity)"
            field_selection:
              transaction_fields:
                - hash
          - event: "OrderCancelled(uint256 indexed orderId)"
            field_selection:
              transaction_fields:
                - hash
          - event: "TradeExecuted(uint256 indexed orderId, uint256 price, uint256 quantity)"
            field_selection:
              transaction_fields:
                - hash

      - name: PageSyncOrderBook
        address:
          - "0x5De52bC09A2A688f6c4615099465e9049CC83bC1"
        start_block: 68348609
        abi_file_path: ./abis/IOrderBook.json
        handler: ./src/handlers/OrderBookHandler.js
        events:
          - event: "OrderPlaced(uint256 indexed orderId, address indexed trader, uint256 price, uint256 quantity, uint8 side)"
            field_selection:
              transaction_fields:
                - hash
          - event: "OrderUpdated(uint256 indexed orderId, uint256 price, uint256 quantity)"
            field_selection:
              transaction_fields:
                - hash
          - event: "OrderCancelled(uint256 indexed orderId)"
            field_selection:
              transaction_fields:
                - hash
          - event: "TradeExecuted(uint256 indexed orderId, uint256 price, uint256 quantity)"
            field_selection:
              transaction_fields:
                - hash

      - name: KuruMarket
        address:
          - "0xa241896A7Dbe8a550D2E5fF7A914bB1989ceD2D9"
        start_block: 68348601
        abi_file_path: ./abis/KuruMarket.json
        handler: ./src/handlers/KuruMarketHandler.js
        events:
          - event: "OrderCreated(uint40 orderId, address owner, uint96 size, uint32 price, bool isBuy)"
            field_selection:
              transaction_fields:
                - hash
          - event: "Trade(uint40 orderId, address makerAddress, bool isBuy, uint256 price, uint96 updatedSize, address takerAddress, address txOrigin, uint96 filledSize)"
            field_selection:
              transaction_fields:
                - hash
          - event: "OrdersCanceled(uint40[] orderId, address owner)"
            field_selection:
              transaction_fields:
                - hash
